<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Portal — Legal contracts &amp; renewal</title>
<style>
/* ============================================================================
   Rebuilt from "Legal - Multiple Upload.pdf" (client portal → project → Legal),
   plus the two controls the renewal requirement adds:
     · Signing Requirement   — new applicants / existing agents / both
     · Require periodic re-signing — interval, counted from each agent's signature
   Both sit per document inside step 2, because the contracts table is per document:
   an NDA rarely needs renewal while an IC agreement does, and a batch-level setting
   would force two passes through the wizard for the commonest case.
   ========================================================================== */
:root{
  /* One primary purple everywhere. --purple-d is only the pressed/hover step. */
  --purple:#6938EF; --purple-d:#5a2ce0;
  --purple-soft:#E9DDFB; --purple-tint:#F6F2FF; --purple-line:#D8C7FB;
  --ink:#0F1728; --ink2:#344054; --ink3:#667085; --ink4:#98A2B3;
  --line:#EAECF0; --line2:#EDEFF5; --bg:#F4F6F8;
  --mint-bg:#E9FBF3; --mint-tx:#067647; --mint-ln:#A9E7CB;
  --grey-bg:#F2F4F7; --grey-tx:#475467;
  --red:#D92D20; --red-bg:#FEF3F2; --red-ln:#FDA29B;
  --amber:#B54708; --amber-bg:#FFFAEB; --amber-ln:#FEDF89;
  --r:12px;
  --font:'Poppins','Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
.sp{flex:1}
[hidden]{display:none!important}

/* ---------- app frame ---------- */
.app{display:flex;min-height:100vh}
.side{width:268px;flex:0 0 268px;background:#fff;border-right:1px solid var(--line2);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.main{flex:1;min-width:0;position:relative}
/* the dotted field behind the page title, as in the source */
.main::before{content:'';position:absolute;inset:0 0 auto 0;height:300px;pointer-events:none;
  background-image:radial-gradient(circle,#E7EAF2 9px,transparent 10px);
  background-size:62px 62px;background-position:60% -18px;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);
          mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),transparent)}
.mainin{position:relative;padding:34px 48px 60px;max-width:1420px}

/* ---------- sidebar ---------- */
.logo{display:flex;align-items:center;gap:11px;padding:24px 22px 16px}
.mark{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:26px}
.mark i{width:6px;height:6px;border-radius:50%;background:#14C8A0;display:block}
.logo b{font-size:15px;line-height:1.12;letter-spacing:-.01em}
.projsel{margin:0 22px 22px;display:flex;align-items:center;gap:10px;width:calc(100% - 44px);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;
  background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.projsel svg{width:17px;height:17px;stroke:var(--ink3);flex:0 0 17px}
.nav{padding:0 14px;display:flex;flex-direction:column;gap:2px}
.navdiv{height:1px;background:var(--line2);margin:16px 8px}
.nv{display:flex;align-items:center;gap:13px;width:100%;padding:9px 8px;border-radius:9px;
  font-size:14.5px;font-weight:500;color:var(--ink2);position:relative;text-align:left}
.nv:hover{background:#F7F8FB}
.nv .ico{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center}
.nv .ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.nv.on{background:var(--purple-tint);color:var(--ink);font-weight:600}
.nv.on::after{content:'';position:absolute;right:-14px;top:2px;bottom:2px;width:4px;
  border-radius:4px 0 0 4px;background:var(--purple)}
.sfoot{margin-top:auto;padding:14px 22px 22px}
.sfoot .ln{height:1px;background:var(--line2);margin:0 0 16px}
.who{display:flex;align-items:center;gap:12px;width:100%}
.av{width:38px;height:38px;border-radius:50%;background:var(--purple-tint);color:var(--purple);
  display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:0 0 38px}
.who b{display:block;font-size:14px;font-weight:600}
.who span{display:block;font-size:12.5px;color:var(--ink3)}
.who svg{width:16px;height:16px;stroke:var(--ink3);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- page ---------- */
h1.page{font-size:34px;letter-spacing:-.02em;margin:0 0 26px;font-weight:600}
.shell{background:#fff;border-radius:20px;border:1px solid var(--line2);
  box-shadow:0 1px 3px rgba(16,24,40,.04);padding:26px}
.panel{border:1px solid var(--line);border-radius:14px;padding:26px 28px 22px}
.phead{display:flex;align-items:flex-start;gap:20px;margin-bottom:22px}
.phead h2{margin:0 0 4px;font-size:22px;font-weight:600;letter-spacing:-.01em}
.phead p{margin:0;color:var(--ink3);font-size:14.5px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 18px;
  font-size:14.5px;font-weight:500;color:var(--ink2);white-space:nowrap;
  box-shadow:0 1px 2px rgba(16,24,40,.04);transition:background .12s,border-color .12s}
.btn:hover{background:#FAFAFC}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:600;
  box-shadow:0 1px 2px rgba(16,24,40,.08)}
.btn.pri:hover{background:var(--purple-d);border-color:var(--purple-d)}
.btn.pri[disabled]{background:var(--purple-soft);border-color:var(--purple-soft);
  color:#fff;cursor:not-allowed;box-shadow:none}
.btn.dan{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.dan:hover{background:#b42318;border-color:#b42318}
.btn[disabled]:not(.pri){opacity:.5;cursor:not-allowed}
.btn.wide{flex:1}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:9px}

/* ---------- search + table ---------- */
.search{position:relative;width:340px;margin-bottom:20px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;
  stroke:var(--ink4);fill:none;stroke-width:2;stroke-linecap:round}
.search input{width:100%;padding:11px 13px 11px 40px;border:1px solid var(--line);
  border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.search input::placeholder{color:var(--ink4)}
.search input:focus{outline:none;border-color:var(--purple-line);box-shadow:0 0 0 4px var(--purple-tint)}
table{width:100%;border-collapse:collapse}
thead th{background:#F8F9FB;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  text-align:left;font-size:13px;font-weight:500;color:var(--ink3);padding:13px 16px;white-space:nowrap}
thead th.srt{cursor:pointer;user-select:none}
/* Sits on the text's optical centre rather than its baseline, so the pair of arrows
   reads as part of the label instead of hanging below it. */
thead th .srtwrap{display:inline-flex;align-items:center;gap:6px}
thead th .ar{display:inline-flex;flex-direction:column;gap:2px}
thead th .ar i{width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;display:block}
thead th .ar i.u{border-bottom:4px solid var(--ink4)}
thead th .ar i.d{border-top:4px solid var(--ink4)}
thead th.act .ar i{border-bottom-color:var(--purple);border-top-color:var(--purple)}
tbody td{border-bottom:1px solid var(--line);padding:15px 16px;font-size:14.5px;vertical-align:middle;
  transition:background-color .45s ease}
tbody tr:hover{background:#FCFCFE}
/* Just-published rows hold a purple rail and a tint briefly, then settle. The table is
   sorted newest-first so the new rows are already at the top, but on a list this long
   "something appeared" is easy to miss — this says which ones. */
tbody td:first-child{position:relative}
tbody td:first-child::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  border-radius:0 3px 3px 0;background:var(--purple);opacity:0;transition:opacity .45s ease}
tbody tr.fresh td{background:var(--purple-tint)}
tbody tr.fresh td:first-child::before{opacity:1}
tbody tr.fresh .cty{font-weight:600}
.cty{display:flex;align-items:center;gap:11px;white-space:nowrap}
.flag{font-size:17px;line-height:1;width:22px;text-align:center}
.ctr b{font-weight:400;display:block}
.ctr .sub{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;
  font-size:12.5px;font-weight:500;border:1px solid transparent}
.chip.ok{background:var(--mint-bg);color:var(--mint-tx);border-color:var(--mint-ln)}
.chip.off{background:var(--grey-bg);color:var(--grey-tx);border-color:var(--line)}
.kebab{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;margin-left:auto}
.kebab:hover{background:var(--grey-bg)}
.kebab svg{width:18px;height:18px;stroke:var(--ink3);fill:none;stroke-width:2.4;stroke-linecap:round}
.menu{position:absolute;z-index:40;background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 26px rgba(16,24,40,.13);padding:5px;min-width:206px}
.menu button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:7px;
  font-size:14px;color:var(--ink2);text-align:left}
.menu button:hover{background:var(--purple-tint);color:var(--purple)}
.menu button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.menu .mdiv{height:1px;background:var(--line2);margin:4px 6px}
.pager{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:18px 4px 2px}
.pg{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:14px;
  color:var(--ink2);border:1px solid transparent}
.pg:hover{background:#F7F8FB}
.pg.on{background:var(--purple-tint);color:var(--purple);font-weight:600}
.pg.nav{border-color:var(--line);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.pg[disabled]{opacity:.4;cursor:not-allowed}
.pg svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- no-search-results state ---------- */
.empty{text-align:center;padding:52px 20px 64px}
.empty h3{margin:0 0 7px;font-size:19px;font-weight:600}
.empty p{margin:0 auto;max-width:560px;color:var(--ink3)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(52,64,84,.55);z-index:60;
  display:grid;place-items:center;padding:28px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:min(620px,100%);box-shadow:0 22px 48px rgba(16,24,40,.22);
  padding:26px 28px 24px;max-height:calc(100vh - 56px);display:flex;flex-direction:column}
.modal.sm{width:min(432px,100%)}
.mhead{display:flex;align-items:flex-start;gap:16px}
.mhead h3{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink4);margin-left:auto}
.x:hover{background:var(--grey-bg);color:var(--ink2)}
.x svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}
.msub{margin:9px 0 0;color:var(--ink2);font-size:15px}
.mbody{overflow:auto;margin:0 -4px;padding:0 4px;flex:1}
/* Step 1 is short and its one control opens a popover that has to escape the modal,
   exactly as it does in the source. A scroll container here would clip it. */
.mbody.nocrop{overflow:visible}
.mfoot{display:flex;gap:14px;margin-top:22px}

/* stepper */
.steps{margin:22px 0 22px;position:relative}
.steps .rail{height:2px;background:var(--line);border-radius:2px;margin:0 0 12px;position:relative}
.steps .rail i{position:absolute;left:0;top:0;height:2px;background:var(--purple);
  border-radius:2px;transition:width .2s}
.steps .rail .dot{position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;
  background:var(--purple);transform:translateX(-50%);transition:left .2s}
.steps .lbls{display:flex;font-size:14.5px;color:var(--ink2)}
.steps .lbls span{flex:1;text-align:center}
.steps .lbls span:first-child{text-align:left}
.steps .lbls span:last-child{text-align:right}
.steps .lbls span.on{color:var(--purple);font-weight:500}

/* fields */
.fld{margin-bottom:6px}
.fld>label{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.inp:focus{outline:none;border-color:var(--purple-line);box-shadow:0 0 0 4px var(--purple-tint)}
.inp.bad{border-color:var(--red-ln)}
.inp.bad:focus{box-shadow:0 0 0 4px var(--red-bg)}
.hint{font-size:12.5px;color:var(--ink3);margin-top:6px}
.hint.err{color:var(--red)}
.cnt{font-size:12.5px;color:var(--ink3);text-align:right;margin-top:5px}
.cnt.over{color:var(--red)}
/* line-height:1 — the inherited 1.5 was pushing the "?" off the circle's centre. */
.qm{width:15px;height:15px;border-radius:50%;border:1.4px solid var(--ink4);color:var(--ink4);
  font-size:10px;line-height:1;font-weight:600;display:inline-flex;align-items:center;
  justify-content:center;cursor:help;position:relative;flex:0 0 15px}
.qm:hover>span{opacity:1;transform:translate(0,-50%)}
/* To the right of the icon, vertically centred on it, with a left-pointing tail — so the
   tooltip points back at the thing it explains instead of floating above the label. */
.qm>span{position:absolute;left:calc(100% + 10px);top:50%;transform:translate(-4px,-50%);
  background:var(--ink);color:#fff;font-size:12.5px;line-height:1.4;padding:8px 11px;border-radius:8px;
  width:max-content;max-width:300px;text-align:left;opacity:0;pointer-events:none;
  transition:.14s;z-index:5;font-weight:400}
.qm>span::after{content:'';position:absolute;right:100%;top:50%;transform:translateY(-50%);
  border:6px solid transparent;border-right-color:var(--ink)}

/* country combobox */
.combo{position:relative}
.cbtn{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.04);text-align:left}
/* Open, the whole row is a text field — the I-beam says so before anyone types. */
.cbtn.open{border-color:var(--purple-line);box-shadow:0 0 0 4px var(--purple-tint);cursor:text}
.cbtn.open .cflag,.cbtn.open .globe,.cbtn.open .chev{cursor:text}
/* These two wrap an injected <svg>, so the rule has to reach the svg itself — styling
   the wrapper leaves the icon with no stroke and a default black fill. */
.cbtn .cflag{flex:0 0 19px;height:19px;font-size:17px;line-height:19px;text-align:center}
.cbtn .globe{flex:0 0 19px;height:19px;display:block}
.cbtn .globe svg{width:19px;height:19px;display:block;stroke:var(--ink3);fill:none;stroke-width:1.7}
.cbtn .cv{flex:1;min-width:0;color:var(--ink4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbtn .cv.has{color:var(--ink)}
/* Open, the trigger IS the search field — one control, not a field inside a popover. */
.cbtn .cin{flex:1;min-width:0;border:none;outline:none;background:none;padding:0;font:inherit}
.cbtn .cin::placeholder{color:var(--ink4)}
.cbtn .chev{flex:0 0 17px;height:17px;display:block}
.cbtn .chev svg{width:17px;height:17px;display:block;stroke:var(--ink3);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.clist{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:0 14px 30px rgba(16,24,40,.15);max-height:260px;overflow:auto;z-index:30;padding:4px}
.copt{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:8px;text-align:left}
.copt:hover,.copt.hi{background:#EEF3FF}
.copt .csel{margin-left:auto;display:block;width:17px;height:17px;color:var(--purple)}
.copt .csel svg{width:17px;height:17px;display:block;fill:none;stroke:currentColor;
  stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cnone{padding:16px 14px;color:var(--ink3);font-size:14px}
.cnone b{display:block;color:var(--ink2);font-weight:500;margin-bottom:3px}

/* dropzone + file cards */
.drop{border:1px solid var(--line);border-radius:12px;padding:26px;text-align:center;background:#fff;
  transition:border-color .12s,background .12s}
.drop:hover{border-color:var(--purple-line);background:var(--purple-tint)}
.drop .ic{width:42px;height:42px;border-radius:50%;background:var(--grey-bg);display:grid;
  place-items:center;margin:0 auto 12px}
.drop .ic svg{width:20px;height:20px;stroke:var(--ink2);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.drop b{color:var(--purple);font-weight:600}
.drop .sub{display:block;font-size:13px;color:var(--ink3);margin-top:4px}
.fcount{font-size:13.5px;color:var(--ink3);margin:2px 0 12px}
.fcount.max{color:var(--red);font-weight:500}
.dcard{background:#F8F9FB;border:1px solid var(--line2);border-radius:12px;padding:16px;margin-bottom:14px}
.dcard .top{display:flex;gap:10px;align-items:flex-start}
.dcard .top .fld{flex:1;margin:0}
.trash{width:38px;height:38px;border-radius:9px;border:1px solid var(--red-ln);background:#fff;
  display:grid;place-items:center;margin-top:26px;flex:0 0 38px}
.trash:hover{background:var(--red-bg)}
.trash svg{width:17px;height:17px;stroke:var(--red);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.filebox{border:1.6px dashed var(--purple-line);border-radius:10px;padding:13px 14px;background:#fff;
  display:flex;align-items:center;gap:12px;margin-top:4px}
.filebox .fi{width:34px;height:34px;border-radius:8px;background:var(--purple-tint);display:grid;
  place-items:center;flex:0 0 34px}
.filebox .fi svg{width:17px;height:17px;stroke:var(--purple);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.filebox .fm{flex:1;min-width:0}
.filebox .fm b{display:block;font-size:14px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filebox .fm span{font-size:12.5px;color:var(--ink3)}
.filebox .acts{display:flex;gap:8px}
.lnkbtn{border:1px solid var(--purple-line);color:var(--purple);border-radius:8px;padding:7px 13px;
  font-size:13.5px;font-weight:500;background:#fff}
.lnkbtn:hover{background:var(--purple-tint)}
.bar{height:7px;border-radius:7px;background:var(--line);overflow:hidden;flex:1;margin-top:7px}
.bar i{display:block;height:100%;background:var(--purple);border-radius:7px;transition:width .3s}
.barrow{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2)}

/* signing rules block */
.rules{border-top:1px solid var(--line);margin-top:16px;padding-top:15px}
.rules h5{margin:0 0 3px;font-size:14px;font-weight:600}
.rules .rsub{margin:0 0 11px;font-size:13px;color:var(--ink3)}
.radio{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px;color:var(--ink2)}
.radio input{width:17px;height:17px;accent-color:var(--purple);margin:0;flex:0 0 17px}
.chkline{display:flex;gap:11px;align-items:flex-start;margin-top:14px;padding-top:13px;
  border-top:1px dashed var(--line)}
.chkline input{width:17px;height:17px;accent-color:var(--purple);margin:2px 0 0;flex:0 0 17px}
.chkline label b{display:block;font-size:14px;font-weight:500;color:var(--ink2)}
.chkline label span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.renew{margin:12px 0 0 28px;padding:13px 14px;background:#fff;border:1px solid var(--line);border-radius:10px}
.renew .row{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.renew input.mth{padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:#fff;width:76px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.renew input.mth:focus{outline:none;border-color:var(--purple-line);
  box-shadow:0 0 0 4px var(--purple-tint)}
.renew input.mth.bad{border-color:var(--red-ln)}
.renew input.mth.bad:focus{box-shadow:0 0 0 4px var(--red-bg)}
.renew .note{font-size:12.5px;color:var(--ink3);margin-top:9px}

/* review */
.rev{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rev .r{padding:12px 16px;border-bottom:1px solid var(--line)}
.rev .r:last-child{border-bottom:none}
.rev .k{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:2px}
.rev .v{font-size:15px}
.rev .grp{background:#F8F9FB;padding:9px 16px;border-bottom:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--ink2);letter-spacing:.02em;text-transform:uppercase}
.lock{display:flex;gap:11px;align-items:center;background:#F8F9FB;border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-top:14px;font-size:13.5px;color:var(--ink2)}
.lock svg{width:17px;height:17px;stroke:var(--ink3);fill:none;stroke-width:1.9;flex:0 0 17px}
.confirm{display:flex;gap:11px;align-items:flex-start;margin-top:16px}
.confirm input{width:19px;height:19px;accent-color:var(--purple);margin:1px 0 0;flex:0 0 19px}
.confirm label{font-size:14.5px;color:var(--ink2)}

/* viewer + toast */
.viewer{background:#fff;border-radius:14px;width:min(860px,100%);max-height:calc(100vh - 56px);
  display:flex;flex-direction:column;overflow:hidden}
.vhead{display:flex;align-items:center;gap:14px;padding:14px 18px;background:#2C3444;color:#fff}
.vhead b{font-size:15px;font-weight:500;flex:1}
.vhead .x{color:#fff}.vhead .x:hover{background:rgba(255,255,255,.15)}
.vbody{background:#EEF0F4;padding:26px;overflow:auto}
.paper{background:#fff;max-width:620px;margin:0 auto;padding:54px 62px;
  box-shadow:0 2px 10px rgba(16,24,40,.12);font-size:12px;line-height:1.75;color:#3d4757}
.paper h4{text-align:center;font-size:14px;margin:0 0 22px;letter-spacing:.04em}
.paper h6{margin:20px 0 5px;font-size:12px;letter-spacing:.03em}
#toasts{position:fixed;top:20px;right:22px;z-index:90;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:flex-start;gap:11px;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:13px 16px;box-shadow:0 10px 26px rgba(16,24,40,.14);
  min-width:290px;max-width:390px;font-size:14px;animation:tin .22s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-7px)}}
.toast .ti{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;flex:0 0 21px;margin-top:1px}
.toast.ok .ti{background:var(--mint-bg);color:var(--mint-tx)}
.toast.bad .ti{background:var(--red-bg);color:var(--red)}
.toast .ti svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round}

@media(max-width:1080px){.side{display:none}.mainin{padding:26px 22px 60px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="mainin" id="view"></div></main>
</div>
<div id="overlay"></div>
<div id="toasts"></div>
<script>
/* ============================================================
   ICONS
   ============================================================ */
const I = {
  chev:'<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>',
  chevU:'<svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>',
  left:'<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>',
  right:'<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  dots:'<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="12" cy="19" r="1.1"/></svg>',
  eye:'<svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>',
  eyeOff:'<svg viewBox="0 0 24 24"><path d="M10.6 6.1A9.7 9.7 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3 3.6M6.3 7.9A16.6 16.6 0 0 0 2 12s3.6 6 10 6a9.6 9.6 0 0 0 3.9-.8"/><path d="M3 3l18 18"/></svg>',
  cloudOff:'<svg viewBox="0 0 24 24"><path d="M21.6 16.2A4.4 4.4 0 0 0 18 9.5h-1.1a7 7 0 0 0-6.2-5.3"/><path d="M5.3 5.3A7 7 0 0 0 8.8 18.5h8a4.4 4.4 0 0 0 1.5-.27"/><path d="M2.6 2.6l18.8 18.8"/></svg>',
  globe:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.2 9h17.6M3.2 15h17.6M12 3a15 15 0 0 1 0 18A15 15 0 0 1 12 3z"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M12 16V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>',
  file:'<svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 6h16M9 6V4.6A1.6 1.6 0 0 1 10.6 3h2.8A1.6 1.6 0 0 1 15 4.6V6"/><path d="M6.5 6l.8 13.1A1.9 1.9 0 0 0 9.2 21h5.6a1.9 1.9 0 0 0 1.9-1.9L17.5 6"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>',
  tick:'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  bang:'<svg viewBox="0 0 24 24"><path d="M12 7v6M12 17h.01"/></svg>',
  x:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2"/><path d="M9 9l6 6M15 9l-6 6" stroke-linecap="round"/></svg>'
};
const NAVICONS = {
  Dashboard:['#E6FAF3','#0E9F80','<svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2l1.6 2H18.5A2.5 2.5 0 0 1 21 9.5v8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>'],
  'Project Metrics':['#E9F1FF','#3B6FD4','<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 0-3.2 6.4"/><path d="M20 6v5h-5"/></svg>'],
  'Star Rating':['#FFF6E5','#E8930C','<svg viewBox="0 0 24 24"><path d="M7 21V11l4.2-7.4a1.6 1.6 0 0 1 2.9 1.1L13.4 9h4.8a2 2 0 0 1 2 2.4l-1.3 6.8A2 2 0 0 1 16.9 21z"/></svg>'],
  'Pay Rates':['#E6FAF3','#0E9F80','<svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M16 7.5H10a2.8 2.8 0 0 0 0 5.6h4a2.8 2.8 0 0 1 0 5.6H8"/></svg>'],
  'Agents Experience':['#E9F1FF','#3B6FD4','<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.3"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 4.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg>'],
  Schedule:['#E9F1FF','#3B6FD4','<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.4"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="9" cy="14.5" r=".9" fill="currentColor"/><circle cx="13" cy="14.5" r=".9" fill="currentColor"/></svg>'],
  Contacts:['#E6FAF3','#0E9F80','<svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/><circle cx="11" cy="14" r="2.3"/><path d="M14 17l1.6 1.6"/></svg>'],
  Agents:['#E9F1FF','#3B6FD4','<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>'],
  Chats:['#FFF6E5','#E8930C','<svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>'],
  'Project Invoices':['#E9F1FF','#3B6FD4','<svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/><path d="M8 13h8M8 17h5"/></svg>'],
  'Agent Invoices':['#E9F1FF','#3B6FD4','<svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/><path d="M8 13h8M8 17h5"/></svg>'],
  'Project Settings':['#F2EDFF','#6938EF','<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>'],
  Training:['#F2EDFF','#6938EF','<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>'],
  Legal:['#F2EDFF','#6938EF','<svg viewBox="0 0 24 24"><path d="M3 20h9"/><path d="M6.5 13.5 13 7"/><path d="m11.2 3.6 5.2 5.2"/><path d="m14.5 2.3 7.2 7.2-2.5 2.5-7.2-7.2z"/></svg>'],
  Integrations:['#F2EDFF','#6938EF','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8.4"/><path d="M12 3.6v1.8M12 18.6v1.8M3.6 12h1.8M18.6 12h1.8"/></svg>']
};
const NAV_TOP = ['Dashboard','Project Metrics','Star Rating','Pay Rates','Agents Experience',
  'Schedule','Contacts','Agents','Chats','Project Invoices','Agent Invoices'];
const NAV_BOT = ['Project Settings','Training','Legal','Integrations'];

/* ============================================================
   DATA
   ============================================================
   Countries a project can pick from: only those with a completed Onboarding
   configuration, which is what the empty state and the field tooltip both
   promise. The ineligible ones are simply absent — there is no "greyed out"
   row, because a client cannot act on the reason anyway. */
const COUNTRIES = [
  ['Argentina','\u{1F1E6}\u{1F1F7}'],['Australia','\u{1F1E6}\u{1F1FA}'],['Brazil','\u{1F1E7}\u{1F1F7}'],
  ['Chile','\u{1F1E8}\u{1F1F1}'],['Colombia','\u{1F1E8}\u{1F1F4}'],['Egypt','\u{1F1EA}\u{1F1EC}'],
  ['Ghana','\u{1F1EC}\u{1F1ED}'],['India','\u{1F1EE}\u{1F1F3}'],['Mexico','\u{1F1F2}\u{1F1FD}'],
  ['Philippines','\u{1F1F5}\u{1F1ED}'],['Portugal','\u{1F1F5}\u{1F1F9}'],['Spain','\u{1F1EA}\u{1F1F8}']
];
const flagOf = n => (COUNTRIES.find(c=>c[0]===n)||[,'\u{1F3F3}'])[1];

/* Sample files the fake picker hands back, so Replace and multi-upload have
   something to show without a real file input. */
const SAMPLES = [
  ['ICA_2026_v1.pdf','1.8 MB'],['project_nda.pdf','1.8 MB'],['msa_2026.pdf','2.4 MB'],
  ['platform_tos_v3.pdf','940 KB'],['data_addendum.pdf','1.1 MB'],['ICA_2026_revised.pdf','1.3 MB']
];
let sampleN = 0;
const nextSample = () => { const s = SAMPLES[sampleN % SAMPLES.length]; sampleN++;
  return {name:s[0], size:s[1]}; };

/* One row per document, matching the table in the source file. `renew` and `audience`
   are the two new per-document settings, both fixed at publish. */
let ROWS = [];
function seed(){
  const base = [
    ['Argentina','Master Services Agreement','Active','08/05/2026',0,'both'],
    ['Brazil','Agents Only Non-Disclosure Agreement','Active','08/03/2026',0,'both'],
    ['Brazil','Independent Contractor Agreement','Offline','07/30/2026',0,'both'],
    ['Colombia','Agents Only Platform Terms of Service','Active','07/22/2026',0,'new'],
    ['Chile','Agents Only Non-Disclosure Agreement','Active','07/14/2026',0,'both'],
    ['Chile','Independent Contractor Agreement','Active','07/01/2026',0,'both'],
    ['Egypt','Independent Contractor Agreement','Active','07/01/2026',0,'both'],
    ['Philippines','Independent Contractor Agreement','Active','06/30/2026',0,'both'],
    ['Philippines','Master Services Agreement','Active','06/11/2026',0,'existing'],
    ['Portugal','Independent Contractor Work Agreement Document','Active','06/08/2026',0,'both'],
    /* The one already on a renewal schedule, so the list state is visible from
       the start rather than only after a publish. */
    ['Australia','Independent Contractor Agreement','Active','06/02/2026',6,'both'],
    ['Australia','Agents Only Non-Disclosure Agreement','Active','05/28/2026',0,'both'],
    ['India','Independent Contractor Agreement','Active','05/19/2026',0,'both'],
    ['India','Master Services Agreement','Active','05/11/2026',0,'both'],
    ['Mexico','Independent Contractor Agreement','Active','04/30/2026',0,'both'],
    ['Mexico','Agents Only Platform Terms of Service','Offline','04/22/2026',0,'both'],
    ['Spain','Independent Contractor Agreement','Active','04/08/2026',12,'both'],
    ['Spain','Agents Only Non-Disclosure Agreement','Active','03/30/2026',0,'new'],
    ['Ghana','Master Services Agreement','Active','03/18/2026',0,'both'],
    ['Colombia','Independent Contractor Agreement','Active','03/02/2026',0,'both'],
    ['Argentina','Agents Only Non-Disclosure Agreement','Active','02/19/2026',0,'both'],
    ['Egypt','Agents Only Platform Terms of Service','Offline','02/04/2026',0,'existing']
  ];
  ROWS = base.map((r,i)=>({id:'c'+i, country:r[0], title:r[1], status:r[2], date:r[3],
    renew:r[4], audience:r[5]}));
}
seed();

/* ============================================================
   STATE
   ============================================================ */
const S = {
  q:'', page:1, sortKey:'date', sortDir:'desc',
  menu:null, menuAt:null,
  modal:null,          // wizard | offline | discard | viewer
  step:1,
  target:null,         // row id for offline / rules / viewer
  fresh:null,          // ids of rows just published, highlighted briefly
  wz:null
};
const PER = 10;
const MAXFILES = 5;
const NAMEMAX = 60;
/* The shortest interval, deliberately — not the most common one.
   With no country cap to validate against, the default cannot be "right", so it should be
   the one that fails harmlessly. Too short only means agents re-sign more often than the
   law asks: friction, recoverable, no exposure. Too long means a contract outlives the cap
   this feature exists to enforce, and nobody finds out until an audit.
   Replace this with a per-country lookup once legal supplies the caps — the list is short,
   and that turns the default from a guess into data. */
const DEFAULT_MONTHS = '3';
/* A plain number box rather than a preset list. Presets would imply "these are the values
   that matter", and there is no country-cap table to source such a list from — so someone
   whose real cap is 9 or 18 months would pick the nearest option instead of the right
   number. The box makes no claim about which values are real; min/max and the "months"
   suffix do the work a dropdown would have done, without the mode switch that a
   "Custom…" option forces on the control. */
const MIN_MONTHS = 1, MAX_MONTHS = 60;

/* A fresh wizard. `docs` holds one entry per uploaded file, because the table is
   per document: name, file, and the two signing settings all belong to the
   document rather than to the country batch. */
function newWizard(country){
  return {country:country||null, csearch:'', copen:false, ctouched:false, docs:[], confirm:false};
}
function newDoc(file){
  return {uid:'d'+Math.random().toString(36).slice(2,8), name:'', file:file,
          progress:100, audience:'both', renew:false, months:DEFAULT_MONTHS};
}

/* ============================================================
   SIDEBAR
   ============================================================ */
function navItem(name){
  const [bg,fg,svg] = NAVICONS[name];
  const on = name==='Legal';
  return `<button class="nv ${on?'on':''}" onclick="${on?'closeAll()':`toast('bad','${esc(name)} is not part of this prototype')`}">
    <span class="ico" style="background:${bg};color:${fg}">${svg}</span>${esc(name)}</button>`;
}
function sideHTML(){
  return `<div class="logo"><span class="mark">${'<i></i>'.repeat(9)}</span><b>Agents<br>Only</b></div>
    <button class="projsel" onclick="toast('bad','Project switching is not part of this prototype')">
      <span class="sp" style="text-align:left">Project Name 1</span>${I.chev}</button>
    <div class="nav">${NAV_TOP.map(navItem).join('')}</div>
    <div class="navdiv"></div>
    <div class="nav">${NAV_BOT.map(navItem).join('')}</div>
    <div class="sfoot"><div class="ln"></div>
      <button class="who" onclick="toast('bad','Account menu is not part of this prototype')">
        <span class="av">JD</span><span style="text-align:left"><b>Janet Doe</b><span>Client</span></span>
        <span class="sp"></span>${I.chev}</button></div>`;
}

/* ============================================================
   LIST
   ============================================================ */
function filtered(){
  const q = S.q.trim().toLowerCase();
  let list = ROWS.filter(r=>!q || r.country.toLowerCase().includes(q));
  const dir = S.sortDir==='asc' ? 1 : -1;
  list.sort((a,b)=>{
    if(S.sortKey==='country') return a.country.localeCompare(b.country)*dir;
    const [am,ad,ay]=a.date.split('/'), [bm,bd,by]=b.date.split('/');
    return ((ay+am+ad) > (by+bm+bd) ? 1 : -1)*dir;
  });
  return list;
}
function sortHead(key,label){
  const on = S.sortKey===key;
  return `<th class="srt ${on?'act':''}" onclick="sortBy('${key}')"><span class="srtwrap">${label}
    <span class="ar"><i class="u"></i><i class="d"></i></span></span></th>`;
}
function sortBy(k){
  if(S.sortKey===k) S.sortDir = S.sortDir==='asc'?'desc':'asc';
  else { S.sortKey=k; S.sortDir = k==='country'?'asc':'desc'; }
  S.menu=null; refreshResults();
}
function refreshResults(){
  const host = document.getElementById('results');
  if(host){ host.innerHTML = resultsHTML(); drawMenu(); } else renderList();
}
/* The renewal schedule lives under the contract name rather than in a column of
   its own. Only a handful of countries will ever use it, and an empty column on
   every other row would cost more than it tells anyone. */
function rowHTML(r){
  return `<tr class="${S.fresh && S.fresh.has(r.id) ? 'fresh' : ''}">
    <td><span class="cty"><span class="flag">${flagOf(r.country)}</span>${esc(r.country)}</span></td>
    <td><span class="ctr"><b>${esc(r.title)}</b>
      ${r.renew?`<span class="sub">Signature renewal every ${r.renew} months</span>`:''}
    </span></td>
    <td><span class="chip ${r.status==='Active'?'ok':'off'}">${r.status}</span></td>
    <td style="white-space:nowrap">${r.date}</td>
    <td><button class="kebab" onclick="openMenu(event,'${r.id}')">${I.dots}</button></td>
  </tr>`;
}
/* Only the results redraw while someone is typing. Rebuilding the whole page on each
   keystroke destroyed the input the keystroke came from, which took the caret with it. */
function resultsHTML(){
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length/PER));
  if(S.page>pages) S.page=pages;
  const slice = list.slice((S.page-1)*PER, S.page*PER);
  if(!slice.length) return `<div class="empty" style="padding:44px 20px">
    <h3>No countries match "${esc(S.q)}"</h3><p>Try a different country name.</p></div>`;
  return `<table>
      <thead><tr>${sortHead('country','Country')}<th>Contract</th><th>Status</th>
        ${sortHead('date','Upload Date')}<th style="width:70px">Actions</th></tr></thead>
      <tbody>${slice.map(rowHTML).join('')}</tbody></table>
    ${pagerHTML(pages)}`;
}
function filterList(v){
  S.q = v; S.page = 1; S.menu = null;
  const host = document.getElementById('results');
  if(host) host.innerHTML = resultsHTML(); else renderList();
}
function listHTML(){
  const body = `<div class="search">${I.search}
      <input id="q" placeholder="Search country" value="${esc(S.q)}"
             oninput="filterList(this.value)"></div>
    <div id="results">${resultsHTML()}</div>`;
  return `<h1 class="page">Legal</h1>
    <div class="shell"><div class="panel">
      <div class="phead">
        <div><h2>Legal Contracts</h2>
          <p>Upload the project legal contracts during onboarding, per country.</p></div>
        <div class="sp"></div>
        <button class="btn pri" onclick="startWizard()">${I.plus}Upload Project Contract</button>
      </div>
      ${body}
    </div></div>`;
}
function pagerHTML(pages){
  if(pages<2) return '<div class="pager"></div>';
  const n = Array.from({length:pages},(_,i)=>i+1);
  return `<div class="pager">
    <button class="pg nav" ${S.page===1?'disabled':''} onclick="goPage(${S.page-1})">${I.left}</button>
    ${n.map(p=>`<button class="pg ${p===S.page?'on':''}" onclick="goPage(${p})">${p}</button>`).join('')}
    <button class="pg nav" ${S.page===pages?'disabled':''} onclick="goPage(${S.page+1})">${I.right}</button>
  </div>`;
}
function goPage(p){ S.page=p; S.menu=null; refreshResults(); }

/* Highlight the rows that were just added, then let them settle.
   The class is removed in place rather than by re-rendering: a re-render swaps in fresh
   <tr> elements, and the browser has nothing to transition from, so the highlight would
   vanish in one frame instead of fading. */
let freshTimer = null;
const FRESH_MS = 800;
function flashRows(ids){
  S.fresh = new Set(ids);
  refreshResults();
  clearTimeout(freshTimer);
  freshTimer = setTimeout(()=>{
    S.fresh = null;
    document.querySelectorAll('tbody tr.fresh').forEach(tr=>tr.classList.remove('fresh'));
  }, FRESH_MS);
}

/* ---------- row menu ---------- */
function openMenu(e,id){
  e.stopPropagation();
  if(S.menu===id) return closeMenu();
  const r = e.currentTarget.getBoundingClientRect();
  S.menu=id; S.menuAt={top:r.bottom+6, left:Math.min(r.left-170, window.innerWidth-230)};
  drawMenu();
}
function closeMenu(){ S.menu=null; drawMenu(); }
function drawMenu(){
  const host = document.getElementById('overlay');
  if(!S.menu || S.modal){ if(!S.modal) host.innerHTML=''; return; }
  const r = ROWS.find(x=>x.id===S.menu);
  /* No "Edit signing rules". Changing a renewal interval on a live contract raises a
     question nobody has answered yet — what happens to agents who have already renewed
     under the old interval — so the route in is deliberately the blunt one: offline the
     contract and publish the same document again with the new setting.
     Note what is also absent: there is no "bring back online". Offlining is irreversible
     by design, which the confirm dialog states before it happens. An offline contract is
     a record, so View is all that is left for it. */
  const live = r.status==='Active';
  host.innerHTML = `<div class="menu" style="top:${S.menuAt.top}px;left:${S.menuAt.left}px">
    <button onclick="openViewer('${r.id}')">${I.eye}View contract</button>
    ${live?`<div class="mdiv"></div>
      <button onclick="askOffline('${r.id}')">${I.cloudOff}Offline</button>`:''}
  </div>`;
}
document.addEventListener('click',()=>{ if(S.menu) closeMenu(); });

/* ============================================================
   VIEWER · OFFLINE · SIGNING RULES
   ============================================================ */
function openViewer(id){ S.menu=null; S.modal='viewer'; S.target=id; render(); }
function askOffline(id){ S.menu=null; S.modal='offline'; S.target=id; render(); }
function doOffline(){
  const r = ROWS.find(x=>x.id===S.target);
  r.status='Offline';
  closeAll();
  toast('ok','Successfully switched offline.');
}
/* ============================================================
   WIZARD
   ============================================================ */
function startWizard(country){
  S.modal='wizard'; S.step=1; S.menu=null; S.wz=newWizard(country); render();
}
/* Anything typed or picked is work the agent would lose, so closing asks first.
   Step 1 with nothing chosen has nothing to lose, and asking there would be a
   dialog about nothing. */
function tryClose(){
  const w=S.wz;
  if(S.modal==='wizard' && (w.country || w.docs.length)) { S.modal='discard'; return render(); }
  closeAll();
}
function closeAll(){ S.modal=null; S.menu=null; S.target=null; render(); }

/* [key, radio label, tooltip, summary label]. The radio reads "Both (all agents)" because
   it sits beneath the other two options and has to say it covers them. In the review there
   is nothing left to be "both" of, so it just states who signs. */
const AUD = [
  ['new','New applicants','Agents who apply after you publish'],
  ['existing','Existing agents','Agents already in the project'],
  ['both','Both (all agents)','','All agents']
];
const audLabel = k => { const a = AUD.find(x=>x[0]===k); return a ? (a[3]||a[1]) : '—'; };

/* Every document in the batch must have a file and a usable name before the
   wizard can move on. Names have to be unique inside the batch AND against what
   is already published for the country, because the table has no other handle
   on a row. */
function nameErr(w, d){
  const n = d.name.trim();
  if(!n) return 'Enter a document name.';
  if(d.name.length > NAMEMAX) return 'Document name is too long.';
  const dupeBatch = w.docs.some(o=>o!==d && o.name.trim().toLowerCase()===n.toLowerCase());
  const dupeLive  = ROWS.some(r=>r.country===w.country && r.title.toLowerCase()===n.toLowerCase());
  if(dupeBatch || dupeLive) return 'Document names must be unique within each country. Please try again.';
  return null;
}
/* The field only ever holds digits now, so the message no longer has to say "whole
   number" — the only mistakes left are an empty box or a number outside the range. */
function monthsErr(d){
  if(!d.renew) return null;
  const v = parseInt(String(d.months),10);
  return (!v || v<MIN_MONTHS || v>MAX_MONTHS)
    ? `Enter a number between ${MIN_MONTHS} and ${MAX_MONTHS}.` : null;
}
function step2Ready(){
  const w=S.wz;
  return w.docs.length>0 && w.docs.every(d=>d.file && !nameErr(w,d) && !monthsErr(d));
}
function renewMonths(d){
  if(!d.renew) return 0;
  return parseInt(d.months,10) || 0;
}

function stepper(){
  const pct = [0,50,100][S.step-1];
  const lab = ['Select country','Upload file','Review &amp; publish'];
  return `<div class="steps">
    <div class="rail"><i style="width:${pct}%"></i><span class="dot" style="left:${pct}%"></span></div>
    <div class="lbls">${lab.map((l,i)=>`<span class="${i===S.step-1?'on':''}">${l}</span>`).join('')}</div>
  </div>`;
}

/* ---------- step 1 ---------- */
function step1(){
  const w = S.wz;
  return `<div class="fld">
    <label>Country
      <span class="qm">?<span>Only countries that are part of this project are listed</span></span></label>
    <div class="combo">
      <div class="cbtn ${w.copen?'open':''}" onclick="event.stopPropagation();toggleCombo()">
        ${/* The leading slot carries the globe until a country is chosen, then that
              country's flag — so the field shows its own value rather than repeating the
              generic icon beside it. The flag stays put while the list is open: the
              current selection still stands until a new one is picked, and the caret plus
              the "Search country" placeholder are what say the field is typeable. */''}
        ${w.country
          ? `<span class="cflag">${flagOf(w.country)}</span>`
          : `<span class="globe">${I.globe}</span>`}
        ${/* Open, the field keeps showing the country that is still selected and puts a
              blinking caret after it, so it reads as "this is the value, and you can type
              over it". The first keystroke clears the name rather than appending to it —
              see comboKey — which is what makes that promise true. */''}
        ${w.copen
          ? `<input class="cin" id="csearch" autocomplete="off" placeholder="Search country"
                    value="${esc(w.csearch)}" onclick="event.stopPropagation()"
                    onkeydown="comboKey(event)" oninput="filterCountries(this.value)">`
          : `<span class="cv ${w.country?'has':''}">${w.country
                ? esc(w.country) : 'Select or search a country'}</span>`}
        <span class="chev">${w.copen?I.chevU:I.chev}</span>
      </div>
      ${w.copen?`<div class="clist" id="clist" onclick="event.stopPropagation()">${countryOpts()}</div>`:''}
    </div>
  </div>`;
}
function countryOpts(){
  const w = S.wz;
  /* Until the first keystroke the field is showing the current selection, not a query —
     so the list stays whole and simply marks where that selection sits. Filtering on it
     would hide every other option behind a word the person has not typed. */
  const opts = w.ctouched
    ? COUNTRIES.filter(c=>c[0].toLowerCase().includes(w.csearch.trim().toLowerCase()))
    : COUNTRIES;
  return opts.length
    ? opts.map(c=>`<button class="copt ${c[0]===w.country?'hi':''}" onclick="pickCountry('${c[0]}')">
        <span class="flag">${c[1]}</span>${c[0]}
        ${c[0]===w.country?`<span class="csel" aria-label="Selected">${I.tick}</span>`:''}</button>`).join('')
    : `<div class="cnone"><b>No countries match "${esc(w.csearch)}"</b>
         Only countries with a completed Onboarding configuration are listed.</div>`;
}
/* The first printable key (or a delete) replaces the prefilled country name instead of
   appending to it, so "Chile" + "g" gives "g" rather than "Chileg". */
function comboKey(e){
  const w = S.wz;
  if(w.ctouched) return;
  const k = e.key;
  const printable = k.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey;
  if(!printable && k!=='Backspace' && k!=='Delete') return;
  w.ctouched = true;
  e.currentTarget.value = '';
  if(!printable) filterCountries('');   // nothing left for the delete to remove
}
/* Same rule as the table search: redraw the list, never the field being typed into. */
function filterCountries(v){
  S.wz.csearch = v; S.wz.ctouched = true;
  const host = document.getElementById('clist');
  if(host) host.innerHTML = countryOpts();
}
function toggleCombo(){
  const w = S.wz;
  w.copen = !w.copen;
  /* Opening seeds the field with the standing selection and leaves it untouched. */
  w.csearch = w.copen ? (w.country||'') : '';
  w.ctouched = false;
  drawModal();
  if(w.copen) setTimeout(()=>{
    const e = document.getElementById('csearch');
    if(!e) return;
    e.focus();
    e.setSelectionRange(e.value.length, e.value.length);   // caret after the name, blinking
  },0);
}
function closeCombo(){
  if(S.wz && S.wz.copen){ S.wz.copen=false; S.wz.csearch=''; S.wz.ctouched=false; drawModal(); }
}
function pickCountry(c){
  S.wz.country=c; S.wz.copen=false; S.wz.csearch=''; S.wz.ctouched=false; drawModal();
}

/* ---------- step 2 ---------- */
function fileCard(d, i, n){
  const w = S.wz;
  const err = d.name ? nameErr(w,d) : null;     // don't shout before they have typed
  const merr = monthsErr(d);
  const over = d.name.length > NAMEMAX;
  return `<div class="dcard">
    <div class="top">
      <div class="fld">
        <label>Document name</label>
        <input class="inp ${err||over?'bad':''}" maxlength="90" placeholder="Enter document name"
               value="${esc(d.name)}" oninput="setName('${d.uid}',this.value)">
        <div class="cnt ${over?'over':''}">${d.name.length}/${NAMEMAX}</div>
        ${err?`<div class="hint err">${err}</div>`:''}
      </div>
      ${n>1?`<button class="trash" title="Remove this document"
               onclick="removeDoc('${d.uid}')">${I.trash}</button>`:''}
    </div>
    <div class="fld" style="margin-top:2px"><label>Document file (.pdf)</label>
      <div class="filebox">
        <span class="fi">${I.file}</span>
        <span class="fm"><b>${esc(d.file.name)}</b>
          ${d.progress<100
            ? `<span class="barrow"><span class="bar"><i style="width:${d.progress}%"></i></span>${d.progress}%</span>`
            : `<span>${d.file.size}</span>`}</span>
        <span class="acts">
          <button class="lnkbtn" onclick="toast('ok','Would open ${esc(d.file.name)}')">View</button>
          <button class="lnkbtn" onclick="replaceFile('${d.uid}')">Replace</button></span>
      </div>
    </div>

    ${/* The two new controls. Per document, and collapsed to a single line while
         re-signing is off, so the ~95% of contracts that never renew pay almost
         nothing for the feature being here. */''}
    <div class="rules">
      <h5>Signing Requirement</h5>
      <p class="rsub">Choose which agents are required to review and sign this document.</p>
      ${AUD.map(([k,l,tip])=>`<label class="radio">
        <input type="radio" name="aud-${d.uid}" ${d.audience===k?'checked':''}
               onchange="setAud('${d.uid}','${k}')">${l}
        ${tip?`<span class="qm">?<span>${tip}</span></span>`:''}</label>`).join('')}

      <div class="chkline">
        <input type="checkbox" id="rn-${d.uid}" ${d.renew?'checked':''}
               onchange="setRenew('${d.uid}',this.checked)">
        <label for="rn-${d.uid}"><b>Require contract renewal</b>
          <span>Agents will be required to sign a new contract when the current contract expires
            or reaches its maximum allowable duration.</span></label>
      </div>
      ${d.renew?`<div class="renew">
        ${/* text + inputmode=numeric, not type=number. A number input still accepts "." ","
              "e" and "-", and while its value is mid-way invalid it reports an empty string,
              so it cannot be filtered reliably. Here every non-digit is dropped as it is
              typed or pasted, which makes a decimal impossible to enter at all — one whole
              class of mistake gone rather than caught. */''}
        <div class="row"><span>Renew every</span>
          <input type="text" inputmode="numeric" maxlength="2" autocomplete="off"
                 class="mth ${merr?'bad':''}" value="${esc(d.months)}"
                 oninput="setMonths('${d.uid}',this.value,this)"><span>months</span>
        </div>
        ${/* Always in the DOM so typing can toggle it in place — re-rendering the card on
              each keystroke would take the caret out of the box being typed into. */''}
        <div class="hint err" ${merr?'':'hidden'}>${merr||''}</div>
        <div class="note">Counted from <b>each agent's own signature date</b>, not the upload date.
          Two agents who signed in different weeks fall due in different weeks.</div>
      </div>`:''}
    </div>
  </div>`;
}
function step2(){
  const w = S.wz, n = w.docs.length, full = n>=MAXFILES;
  /* The counter earns its place from the second file on. At one file it only
     restates what the single card already shows. */
  return `${n>1?`<div class="fcount ${full?'max':''}">${full
      ? `${n}/${MAXFILES} files uploaded. Maximum reached — remove one to add another.`
      : `${n}/${MAXFILES} files uploaded`}</div>`:''}
    ${n?w.docs.map((d,i)=>fileCard(d,i,n)).join(''):''}
    ${full?'':`<div class="fld"><label>Contract document</label>
      <button class="drop" style="width:100%" onclick="addFile()">
        <span class="ic">${I.up}</span>
        <div><b>Click to upload</b> or drag and drop
          <span class="sub">.pdf (up to ${MAXFILES} files · max. 20 MB each)</span></div>
      </button>
    </div>`}`;
}
function addFile(){
  const w=S.wz;
  if(w.docs.length>=MAXFILES) return;
  const d = newDoc(nextSample());
  d.progress = 0;
  w.docs.push(d);
  drawModal();
  /* A visible upload, so the progress state in the source file has somewhere to live. */
  let p=0; const t=setInterval(()=>{ p+=20; d.progress=Math.min(100,p);
    if(S.modal==='wizard') drawModal();
    if(p>=100) clearInterval(t); }, 90);
}
function replaceFile(uid){ const d=S.wz.docs.find(x=>x.uid===uid); d.file=nextSample(); drawModal(); }
function removeDoc(uid){ S.wz.docs = S.wz.docs.filter(x=>x.uid!==uid); drawModal(); }
function setName(uid,v){ const d=S.wz.docs.find(x=>x.uid===uid); d.name=v;
  /* Re-render only the parts that depend on the name, so typing keeps focus. */
  syncStep2(uid); }
function setAud(uid,k){ S.wz.docs.find(x=>x.uid===uid).audience=k; }
function setRenew(uid,v){ S.wz.docs.find(x=>x.uid===uid).renew=v; drawModal(); }
/* Updated in place, not via drawModal — a redraw on every keystroke would pull the caret
   out of the box being typed into. Non-digits are stripped here rather than rejected
   later, so "." and "," simply never land in the field. */
function setMonths(uid,v,el){
  const clean = String(v).replace(/\D+/g,'').slice(0,2);
  if(el && el.value !== clean) el.value = clean;
  S.wz.docs.find(x=>x.uid===uid).months = clean;
  syncStep2(uid);
}
/* Typing must not blow away the field being typed into, so the counter, the
   inline error and the footer button are updated in place. */
function syncStep2(uid){
  const w=S.wz, d=w.docs.find(x=>x.uid===uid);
  const card = document.querySelector(`[oninput*="${uid}"]`)?.closest('.dcard');
  if(card){
    const over = d.name.length>NAMEMAX, err = d.name ? nameErr(w,d) : null;
    const cnt = card.querySelector('.cnt');
    cnt.textContent = d.name.length+'/'+NAMEMAX;
    cnt.classList.toggle('over', over);
    const inp = card.querySelector('.top .inp');
    inp.classList.toggle('bad', !!(err||over));
    let hint = card.querySelector('.top .hint');
    if(err && !hint){ hint=document.createElement('div'); hint.className='hint err';
      cnt.after(hint); }
    if(hint) { hint.textContent = err||''; hint.hidden = !err; }
    const me = monthsErr(d), mbox = card.querySelector('.renew .hint');
    if(mbox){ mbox.textContent = me||''; mbox.hidden = !me; }
    const mnum = card.querySelector('.renew input.mth');
    if(mnum) mnum.classList.toggle('bad', !!me);
  }
  const b = document.getElementById('wzNext');
  if(b) b.disabled = !step2Ready();
}

/* ---------- step 3 ---------- */
function step3(){
  const w = S.wz;
  return `<div class="rev">
      <div class="r"><span class="k">Country</span>
        <span class="v">${flagOf(w.country)} ${esc(w.country)}</span></div>
      ${w.docs.map((d,i)=>{
        const m = renewMonths(d);
        return `${w.docs.length>1?`<div class="grp">Document ${i+1}</div>`:''}
        <div class="r"><span class="k">${w.docs.length>1?`Document ${i+1} name`:'Document name'}</span>
          <span class="v">${esc(d.name)}</span></div>
        <div class="r"><span class="k">Signing requirement</span>
          <span class="v">${audLabel(d.audience)}</span></div>
        ${/* Only when it is on. Re-signing applies to a handful of countries, so a
             "Not required" row on almost every publish was noise standing between the
             reviewer and the things that do vary. */''}
        ${m?`<div class="r"><span class="k">Contract renewal</span>
          <span class="v">Every ${m} months, from each agent's signature date</span></div>`:''}
        <div class="r"><span class="k">File</span><span class="v">${esc(d.file.name)}</span></div>`;
      }).join('')}
    </div>
    <div class="lock">${I.lock}Published versions can't be edited — only replaced by a later version.</div>
    <div class="confirm">
      <input type="checkbox" id="cfm" ${w.confirm?'checked':''}
             onchange="S.wz.confirm=this.checked;drawModal()">
      <label for="cfm">I confirm this document was reviewed by legal for this jurisdiction.</label>
    </div>`;
}

function publish(){
  const w = S.wz;
  if(!w.confirm) return;
  const today = new Date();
  const date = String(today.getMonth()+1).padStart(2,'0')+'/'+
               String(today.getDate()).padStart(2,'0')+'/'+today.getFullYear();
  const added = [];
  w.docs.forEach(d=>{
    const id = 'n'+Math.random().toString(36).slice(2,7);
    added.push(id);
    ROWS.unshift({id:id, country:w.country, title:d.name.trim(), status:'Active', date:date,
      renew:renewMonths(d), audience:d.audience});
  });
  S.q=''; S.page=1; S.sortKey='date'; S.sortDir='desc';
  closeAll();
  toast('ok','Successfully published contract for '+w.country+'.');
  flashRows(added);
}

/* ---------- wizard shell ---------- */
function wizardHTML(){
  const w = S.wz;
  const body = S.step===1 ? step1() : S.step===2 ? step2() : step3();
  let foot;
  if(S.step===1) foot = `<button class="btn wide" onclick="tryClose()">Cancel</button>
    <button class="btn pri wide" ${w.country?'':'disabled'} onclick="S.step=2;drawModal()">Continue</button>`;
  else if(S.step===2) foot = `<button class="btn wide" onclick="S.step=1;drawModal()">Back</button>
    <button class="btn pri wide" id="wzNext" ${step2Ready()?'':'disabled'}
      onclick="S.step=3;drawModal()">Continue</button>`;
  else foot = `<button class="btn wide" onclick="S.step=2;drawModal()">Back</button>
    <button class="btn pri wide" ${w.confirm?'':'disabled'} onclick="publish()">Publish contract</button>`;
  /* A click anywhere else in the modal dismisses an open country list; the trigger and
     the list itself both stop propagation, so this never fires from inside them. */
  return `<div class="modal" onclick="event.stopPropagation();closeCombo()">
    <div class="mhead"><div><h3>Upload legal contract</h3>
      <p class="msub">Attach the country-specific agreement per project.</p></div>
      <button class="x" onclick="tryClose()">${I.x}</button></div>
    ${stepper()}
    <div class="mbody ${S.step===1?'nocrop':''}">${body}</div>
    <div class="mfoot">${foot}</div>
  </div>`;
}

/* ============================================================
   OVERLAYS
   ============================================================ */
function offlineHTML(){
  const r = ROWS.find(x=>x.id===S.target);
  return `<div class="modal sm" onclick="event.stopPropagation()">
    <div class="mhead"><h3>Offline this contract?</h3>
      <button class="x" onclick="closeAll()">${I.x}</button></div>
    <p class="msub"><b>${esc(r.title)}</b> — ${esc(r.country)}.
      Once offline, this contract cannot be republished${r.renew
        ? ', and agents will no longer be asked to renew it' : ''}.</p>
    <div class="mfoot"><button class="btn wide" onclick="closeAll()">Keep Offline</button>
      <button class="btn dan wide" onclick="doOffline()">Offline</button></div>
  </div>`;
}
function discardHTML(){
  return `<div class="modal sm" onclick="event.stopPropagation()">
    <div class="mhead"><h3>Discard changes?</h3></div>
    <p class="msub">Your work on this contract won't be saved.</p>
    <div class="mfoot"><button class="btn wide" onclick="S.modal='wizard';render()">Keep editing</button>
      <button class="btn dan wide" onclick="closeAll()">Discard</button></div>
  </div>`;
}
function viewerHTML(){
  const r = ROWS.find(x=>x.id===S.target);
  return `<div class="viewer" onclick="event.stopPropagation()">
    <div class="vhead"><b>${esc(r.title)} — ${esc(r.country)}</b>
      <button class="x" onclick="closeAll()">${I.x}</button></div>
    <div class="vbody"><div class="paper">
      <h4>${esc(r.title).toUpperCase()}</h4>
      <p style="text-align:center;color:#8a94a6;margin-top:-12px">Project Name 1 · ${esc(r.country)}
        · Uploaded ${r.date}</p>
      <h6>1.&nbsp;&nbsp;SCOPE</h6>
      <p>This agreement is entered into between the Client and the Contractor in respect of services
         performed on the Project Name 1 project within ${esc(r.country)}, and is governed by the laws
         of that jurisdiction.</p>
      <h6>2.&nbsp;&nbsp;TERM</h6>
      <p>${r.renew
        ? `This engagement runs for a maximum of ${r.renew} months from the date of the Contractor's
           signature, after which the Contractor must execute this agreement again in order to
           continue performing services.`
        : `This agreement remains in force for the duration of the Contractor's participation in the
           project, unless terminated earlier in accordance with clause 6.`}</p>
      <h6>3.&nbsp;&nbsp;CONFIDENTIALITY</h6>
      <p>The Contractor shall not disclose client data, materials or pricing encountered on this
         project, and shall return or destroy such materials on request.</p>
      <h6>4.&nbsp;&nbsp;FURTHER TERMS</h6>
      <p>Placeholder text standing in for the remaining clauses of this document.</p>
      <p style="text-align:center;color:#a6aebd;margin-top:34px">— Page 1 of 4 —</p>
    </div></div>
  </div>`;
}

/* ============================================================
   PLUMBING
   ============================================================ */
function esc(s){ return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function toast(kind,msg){
  const t=document.createElement('div');
  t.className='toast '+(kind==='bad'?'bad':'ok');
  t.innerHTML=`<span class="ti">${kind==='bad'?I.bang:I.tick}</span><span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(),4200);
}
/* Any control that changes the modal's shape redraws the whole modal, which recreates its
   scroll container — so without this, ticking "Require periodic re-signing" on the third
   document card threw the person back to the top of the dialog. Keep the scroll position
   and the caret whenever we are redrawing the same view; reset them only when the step or
   the modal itself changes, where landing at the top is the right thing. */
function drawModal(){
  const host = document.getElementById('overlay');
  const key  = S.modal + ':' + S.step;
  const same = host.dataset.mkey === key;

  const oldBody = host.querySelector('.mbody');
  const keepTop = same && oldBody ? oldBody.scrollTop : 0;
  const a       = document.activeElement;
  const keepId  = same && a && a.id && host.contains(a) ? a.id : null;
  const keepSel = keepId && a.type === 'text' ? [a.selectionStart, a.selectionEnd] : null;

  const inner = S.modal==='wizard' ? wizardHTML()
    : S.modal==='offline' ? offlineHTML()
    : S.modal==='discard' ? discardHTML()
    : S.modal==='viewer'  ? viewerHTML() : '';
  if(!inner){ host.dataset.mkey = ''; return drawMenu(); }
  host.innerHTML = `<div class="scrim" onclick="${S.modal==='wizard'?'tryClose()':'closeAll()'}">${inner}</div>`;
  host.dataset.mkey = key;

  const newBody = host.querySelector('.mbody');
  if(newBody && keepTop) newBody.scrollTop = keepTop;
  if(keepId){
    const el = document.getElementById(keepId);
    if(el){
      el.focus({preventScroll:true});
      if(keepSel) try{ el.setSelectionRange(keepSel[0], keepSel[1]); }catch(e){}
    }
  }
}
function renderList(){ document.getElementById('view').innerHTML = listHTML(); }
function render(){
  document.getElementById('side').innerHTML = sideHTML();
  document.getElementById('view').innerHTML = listHTML();
  drawModal();
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(S.modal==='wizard') tryClose(); else if(S.modal) closeAll(); else if(S.menu) closeMenu();
});
render();
</script>
</body>
